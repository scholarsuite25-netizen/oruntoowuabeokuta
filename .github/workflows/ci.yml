name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: Projects/orunto-owu/package-lock.json
      - name: Install
        working-directory: Projects/orunto-owu
        run: npm ci
      - name: Lint
        working-directory: Projects/orunto-owu
        run: npm run lint --if-present
      - name: Build
        working-directory: Projects/orunto-owu
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://oruntoowuabeokuta.org.ng
      - name: Audit (non-blocking)
        working-directory: Projects/orunto-owu
        run: npm audit --audit-level=moderate || true
